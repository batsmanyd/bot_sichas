<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Сейчас · Жалобы</title>
  <style>
    :root{--green:#198754;--ink:#17231b;--muted:#667269;--line:#dce8de;--soft:#edf8ef;--red:#c83d31;--bg:#f4f8f4}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}
    .shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:30px;font-weight:850}.brand span{display:block;color:var(--muted);font-size:15px;font-weight:600;margin-top:3px}.live{padding:8px 12px;border-radius:999px;background:var(--soft);color:var(--green);font-weight:750}
    .metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:24px 0}.metric{background:white;border:1px solid var(--line);border-radius:18px;padding:17px}.metric b{display:block;font-size:31px;margin-bottom:3px}.metric span{color:var(--muted);font-size:14px}.metric.urgent b{color:var(--red)}
    .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.filters select,.filters input{border:1px solid var(--line);border-radius:12px;background:white;padding:11px 12px;min-width:150px}.filters input{flex:1}.filters button,.action{border:0;border-radius:12px;padding:11px 14px;background:var(--green);color:white;font-weight:750}
    .reports{display:grid;gap:12px}.report{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;display:grid;grid-template-columns:1fr auto;gap:14px;cursor:pointer}.report.new{border-left:5px solid var(--red)}.report h2{font-size:20px;margin:0 0 7px}.report p{margin:5px 0;color:var(--muted);line-height:1.4}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--green);font-size:13px;font-weight:750}.tag.red{background:#fff0ee;color:var(--red)}.time{color:var(--muted);font-size:13px;white-space:nowrap}
    dialog{width:min(760px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:0;border-radius:22px;padding:0;box-shadow:0 28px 80px #0005}dialog::backdrop{background:#0008}.detail{padding:22px;max-height:calc(100dvh - 24px);overflow:auto}.detail-head{display:flex;justify-content:space-between;gap:12px}.close{border:0;background:#edf1ed;border-radius:50%;width:42px;height:42px;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{background:#f6f8f6;border-radius:14px;padding:12px}.box small{display:block;color:var(--muted);margin-bottom:5px}.reason{border-left:4px solid var(--red);padding:12px 14px;background:#fff6f4;border-radius:10px;margin:16px 0;line-height:1.45}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.actions button{border:0;border-radius:12px;padding:11px 8px;background:#eaf4ec;color:var(--green);font-weight:750}.actions .danger{background:#fff0ee;color:var(--red)}.evidence{white-space:pre-wrap;background:#18251c;color:#e9f7ed;border-radius:14px;padding:13px;margin-top:12px;display:none}.empty{text-align:center;color:var(--muted);padding:50px}.error{color:var(--red)}
    @media(max-width:760px){.shell{padding:15px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:1/-1}.report{grid-template-columns:1fr}.time{white-space:normal}.grid,.actions{grid-template-columns:1fr}dialog{width:100vw;height:100dvh;max-height:none;border-radius:0}.detail{max-height:100dvh}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><div class="brand">Сейчас · Модерация<span>Жалобы и безопасность сообщества</span></div><div id="live" class="live">Обновляем</div></header>
  <section id="metrics" class="metrics"></section>
  <section class="filters">
    <select id="status"><option value="">Все статусы</option><option value="new">Новые</option><option value="in_progress">В работе</option><option value="confirmed">Подтверждённые</option><option value="dismissed">Отклонённые</option><option value="blocked">Заблокированные</option><option value="resolved">Завершённые</option><option value="auto_hidden">Автоскрытие</option></select>
    <select id="category"><option value="">Все категории</option><option value="safety">Безопасность</option><option value="harassment">Домогательство</option><option value="spam">Спам</option><option value="no_show">Неявка</option><option value="no_show_dispute">Спор о неявке</option><option value="other">Другое</option></select>
    <input id="user" placeholder="ID жалобы или обезличенный пользователь">
    <input id="date" type="date" aria-label="Дата жалобы">
    <button id="apply">Применить</button>
  </section>
  <section id="reports" class="reports"><div class="empty">Загрузка…</div></section>
</main>
<dialog id="dialog"><div id="detail" class="detail"></div></dialog>
<script>
const $=id=>document.getElementById(id);let csrf='',reports=[],selected=null,revision=-1;const requestedReportId=Number(new URLSearchParams(location.search).get('report')||0);
const esc=value=>String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(options.method)headers['X-CSRF-Token']=csrf;const response=await fetch(path,{credentials:'same-origin',cache:'no-store',headers,...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Ошибка запроса');return data}
function metric(label,value,urgent=false){return `<div class="metric ${urgent?'urgent':''}"><b>${value}</b><span>${label}</span></div>`}
async function dashboard(){const data=await api('/api/admin/dashboard');csrf=data.csrf_token;revision=data.revision;$('metrics').innerHTML=metric('Новые',data.counts.new,true)+metric('В работе',data.counts.in_progress)+metric('Заблокированные',data.counts.blocked,true)+metric('Автоскрытие',data.counts.auto_hidden)+metric('Решено сегодня',data.counts.resolved_today)+metric('Всего нерешённых',data.counts.unresolved,data.counts.unresolved>0);$('live').textContent='Связь установлена'}
function render(){if(!reports.length){$('reports').innerHTML='<div class="empty">По выбранному фильтру жалоб нет</div>';return}$('reports').innerHTML=reports.map(r=>`<article class="report ${r.status==='new'?'new':''}" data-id="${r.id}"><div><h2>Жалоба #${r.id}</h2><p>${esc(r.reason)}</p><div class="tags"><span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.status)}</span>${r.auto_hidden?'<span class="tag red">автоскрытие</span>':''}<span class="tag">${r.independent_reports} независимых</span></div></div><div class="time">${new Date(r.created_at).toLocaleString('ru-RU')}</div></article>`).join('');document.querySelectorAll('.report').forEach(el=>el.onclick=()=>openReport(Number(el.dataset.id)))}
async function loadReports(){const params=new URLSearchParams;for(const id of ['status','category','user','date']){if($(id).value)params.set(id,$(id).value)}const data=await api('/api/admin/reports?'+params);reports=data.items;render()}
function actionButton(action,label,danger=false){return `<button class="${danger?'danger':''}" onclick="moderate('${action}')">${label}</button>`}
function openReport(id){selected=reports.find(r=>r.id===id);const r=selected;$('detail').innerHTML=`<div class="detail-head"><div><h1>Жалоба #${r.id}</h1><div class="tags"><span class="tag">${esc(r.status)}</span><span class="tag">${esc(r.category)}</span></div></div><button class="close" onclick="$('dialog').close()">×</button></div><div class="reason">${esc(r.reason)}</div><div class="grid"><div class="box"><small>Заявитель</small><b>${esc(r.reporter)}</b></div><div class="box"><small>Пользователь</small><b>${esc(r.target)}</b></div><div class="box"><small>Встреча</small><b>#${r.meeting_id} · ${esc(r.meeting_status)}</b></div><div class="box"><small>Доверие</small><b>${esc(r.trust.level)} · ${r.trust.score}</b></div><div class="box"><small>Независимых жалоб</small><b>${r.independent_reports}</b></div><div class="box"><small>Решение</small><b>${esc(r.decision||'нет')}</b></div></div><button class="action" style="margin-top:16px" onclick="evidence()">Показать ограниченный фрагмент чата</button><div id="evidence" class="evidence"></div><h3>Действия</h3><div class="actions">${actionButton('take','Взять в работу')}${actionButton('confirm','Подтвердить')}${actionButton('dismiss','Отклонить')}${actionButton('warn','Предупредить')}${actionButton('hide_24h','Скрыть на 24 часа',true)}${actionButton('hide_7d','Скрыть на 7 дней',true)}${actionButton('block','Заблокировать',true)}${actionButton('restore','Восстановить')}${actionButton('close','Закрыть рассмотрение')}</div><h3>История</h3>${r.history.length?r.history.map(x=>`<div class="box"><b>${esc(x.action)}</b><small>${new Date(x.created_at).toLocaleString('ru-RU')}</small>${esc(x.reason||'')}</div>`).join(''):'<p>Действий пока нет</p>'}`;$('dialog').showModal()}
async function moderate(action){if(!selected)return;let reason='Взято в работу';if(action!=='take'){reason=prompt('Укажите причину решения')?.trim()||'';if(reason.length<3)return}try{await api(`/api/admin/reports/${selected.id}/action`,{method:'POST',body:JSON.stringify({action,reason})});await Promise.all([dashboard(),loadReports()]);const current=reports.find(r=>r.id===selected.id);if(current)openReport(current.id);else $('dialog').close()}catch(error){alert(error.message)}}
async function evidence(){try{const data=await api(`/api/admin/reports/${selected.id}/evidence`,{method:'POST',body:'{}'}),box=$('evidence');box.style.display='block';box.textContent=data.items.length?data.items.map(x=>`${new Date(x.created_at).toLocaleTimeString('ru-RU')} ${x.author}: ${x.text}`).join('\n'):'В выбранном временном окне сообщений нет'}catch(error){alert(error.message)}}
$('apply').onclick=loadReports;async function start(){await dashboard();await loadReports();if(requestedReportId){const data=await api(`/api/admin/reports/${requestedReportId}`);reports=[data.report,...reports.filter(item=>item.id!==data.report.id)];openReport(data.report.id)}}start().catch(error=>{$('reports').innerHTML=`<div class="empty error">${esc(error.message)}</div>`});setInterval(async()=>{try{const data=await api('/api/admin/dashboard');if(data.revision!==revision){csrf=data.csrf_token;revision=data.revision;await loadReports()}}catch(_){$('live').textContent='Нет связи'}},5000);
</script>
</body>
</html>
